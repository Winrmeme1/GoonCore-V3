<!doctype html>
<html lang="en" data-theme="midnight" data-background="stars">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070809">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="GoonCore — a private home for the open web, games, and legal movie discovery.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com https://gn-math.github.io; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'self' https:; form-action 'self' https:">
  <title>GoonCore</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23070809'/%3E%3Cpath d='M28 13a11 11 0 1 0 2 13h-9v-5h15v3a16 16 0 1 1-4-16Z' fill='%23e9e9eb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <canvas id="background-canvas" aria-hidden="true"></canvas>
  <div class="app-shell">
    <div class="main-column">
      <header class="topbar">
        <nav class="primary-nav" id="primary-nav" aria-label="GoonCore navigation">
          <button class="nav-item is-active" type="button" data-page="home" data-label="Home" aria-label="Home" aria-current="page" title="Home">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1Z"/></svg></span>
          </button>
          <button class="nav-item" type="button" data-page="web" data-label="Web" aria-label="Web" title="Web">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          </button>
          <button class="nav-item" type="button" data-page="games" data-label="Games" aria-label="Games" title="Games">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 7h11a4 4 0 0 1 3.8 5l-1.1 4a2 2 0 0 1-3.2 1l-2.4-2H9.4l-2.4 2a2 2 0 0 1-3.2-1l-1.1-4a4 4 0 0 1 3.8-5Z"/><path d="M8 10v4m-2-2h4m5-1h.01M18 13h.01"/></svg></span>
          </button>
          <button class="nav-item" type="button" data-page="movies" data-label="Movies" aria-label="Movies" title="Movies">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18m10-18v18M3 8h4m-4 8h4m10-8h4m-4 8h4"/></svg></span>
          </button>
          <button class="nav-item" type="button" data-page="settings" data-label="Settings" aria-label="Settings" title="Settings">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6-.2.1a8 8 0 0 1-1.6 1l-.2.1-.3 1.8h-2.8l-.3-1.8-.2-.1a8 8 0 0 1-1.6-1l-.2-.1-1.7.6-1.4-2.4 1.4-1.1.1-.2a8 8 0 0 1 0-2.1l-.1-.2-1.4-1.1 1.4-2.4 1.7.6.2-.1a8 8 0 0 1 1.6-1l.2-.1.3-1.8h2.8l.3 1.8.2.1a8 8 0 0 1 1.6 1l.2.1 1.7-.6 1.4 2.4-1.4 1.1-.1.2a8 8 0 0 1 0 2.1Z" transform="translate(-.8 -1.7) scale(.93)"/></svg></span>
          </button>
        </nav>
      </header>
      <main id="app-main" tabindex="-1" aria-label="GoonCore">
        <div class="loading-page"><span class="spinner" aria-hidden="true"></span><span>Getting your space ready…</span></div>
      </main>
    </div>
  </div>
  <dialog class="dialog" id="dialog" aria-labelledby="dialog-title"><div class="dialog-content" id="dialog-content"></div></dialog>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
